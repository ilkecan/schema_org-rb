name: Pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    name: PR gate
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
      - name: Run Standard
        run: bundle exec rake standard
      - name: Check types
        run: bundle exec rake types:check
      - name: Check generated files
        run: bundle exec rake codegen:check
      - name: Verify package
        run: bundle exec rake package:check
